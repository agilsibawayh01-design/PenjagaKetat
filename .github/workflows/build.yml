name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PK_KEYSTORE_B64: ${{ secrets.PK_KEYSTORE_B64 }}
      PK_KEYSTORE_PASS: ${{ secrets.PK_KEYSTORE_PASS }}
      PK_KEY_ALIAS: ${{ secrets.PK_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses (preinstalled SDK)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Generate Gradle wrapper (dengan ulang otomatis)
        run: |
          ok=0
          for i in 1 2 3; do
            if gradle wrapper --gradle-version 8.7 --no-validate-url && chmod +x gradlew && ./gradlew --version; then
              ok=1
              break
            fi
            echo "Gagal mengunduh Gradle 8.7, mencoba lagi ($i/3)..."
            sleep 20
          done
          test "$ok" = 1

      # Model deteksi gambar AI utama (ONNX, lisensi MIT) diunduh saat build, tidak disimpan di repo.
      # Dicoba berurutan: m (akurasi 98,06%), s, xs. Bila semua gagal, APK tetap dibuat dan memakai model TFLite cadangan.
      - name: Unduh model deteksi gambar AI
        continue-on-error: true
        run: |
          mkdir -p app/src/main/assets/nsfw
          got=""
          for v in m s xs; do
            for path in "onnx/image-safety-classifier-$v.onnx" "image-safety-classifier-$v.onnx"; do
              url="https://huggingface.co/OwenElliott/image-safety-classifier-$v/resolve/main/$path"
              echo "Mencoba $url"
              if curl -fL --retry 3 --retry-delay 5 -o /tmp/safety.onnx "$url"; then
                size=$(stat -c %s /tmp/safety.onnx)
                if [ "$size" -gt 5000000 ]; then
                  mv /tmp/safety.onnx app/src/main/assets/nsfw/safety.onnx
                  got="$v ($size byte)"
                  break 2
                fi
              fi
            done
          done
          if [ -n "$got" ]; then
            echo "MODEL_AI=$got" >> "$GITHUB_STEP_SUMMARY"
            echo "Model AI terpasang: $got"
          else
            echo "MODEL_AI=gagal diunduh (memakai model cadangan)" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Tes unit (logika murni). Gagal tes TIDAK menghentikan pembuatan APK; lihat artifact laporan tes.
      - name: Unit tests
        id: tests
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: Lint
        id: lint
        continue-on-error: true
        run: ./gradlew lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: laporan-tes-dan-lint
          retention-days: 2
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon -PbuildNumber=${{ github.run_number }}

      # Penandatanganan rilis. Kunci lama (debug.keystore) tetap dipakai sebagai penanda awal; kunci baru
      # dari GitHub Secrets ditambahkan lewat rotasi kunci APK (lineage) supaya APK baru MENIMPA aplikasi
      # lama tanpa uninstall. Tanpa Secrets: APK tetap ditandatangani kunci lama seperti sebelumnya.
      - name: Sign release (rotasi kunci)
        id: sign
        run: |
          set -e
          APK=app/build/outputs/apk/release/app-release.apk
          if [ -z "$PK_KEYSTORE_B64" ] || [ -z "$PK_KEYSTORE_PASS" ]; then
            echo "SIGNING=kunci-lama (Secrets belum diisi)" >> "$GITHUB_STEP_SUMMARY"
            echo "signed=old" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ALIAS="${PK_KEY_ALIAS:-pkrelease}"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          AS="$BT/apksigner"
          echo "$PK_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pk-release.jks"
          OLD_ARGS=(--ks app/debug.keystore --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android)
          NEW_ARGS=(--ks "$RUNNER_TEMP/pk-release.jks" --ks-key-alias "$ALIAS" --ks-pass env:PK_KEYSTORE_PASS --key-pass env:PK_KEYSTORE_PASS)
          "$AS" rotate --out "$RUNNER_TEMP/pk.lineage" --old-signer "${OLD_ARGS[@]}" --new-signer "${NEW_ARGS[@]}"
          cp "$APK" "$RUNNER_TEMP/unsigned-or-old.apk"
          "$AS" sign "${OLD_ARGS[@]}" --next-signer "${NEW_ARGS[@]}" \
            --lineage "$RUNNER_TEMP/pk.lineage" --min-sdk-version 29 \
            --out "$RUNNER_TEMP/app-release-rotated.apk" "$RUNNER_TEMP/unsigned-or-old.apk"
          "$AS" verify --verbose --print-certs "$RUNNER_TEMP/app-release-rotated.apk" | tee "$RUNNER_TEMP/verify.txt"
          grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" "$RUNNER_TEMP/verify.txt"
          cp "$RUNNER_TEMP/app-release-rotated.apk" "$APK"
          echo "SIGNING=rotasi kunci OK (v3 terverifikasi)" >> "$GITHUB_STEP_SUMMARY"
          echo "signed=rotated" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/pk-release.jks"

      # APK dipublikasikan lewat GitHub Release (tidak memakai kuota artifact Actions).
      - name: Publikasikan Release
        env:
          # Opsional: terbitkan APK ke repo publik terpisah (kode tetap di repo privat).
          # Isi secret RELEASE_REPO (pemilik/nama) dan RELEASE_TOKEN (token dengan izin Contents: write ke repo itu).
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          GH_REPO: ${{ secrets.RELEASE_REPO || github.repository }}
        run: |
          set -e
          TAG="build-${{ github.run_number }}"
          FILE="PenjagaKetat-$TAG.apk"
          cp app/build/outputs/apk/release/app-release.apk "$FILE"
          TARGET=()
          if [ "$GH_REPO" = "${{ github.repository }}" ]; then TARGET=(--target "$GITHUB_SHA"); fi
          gh release create "$TAG" "$FILE" --title "PenjagaKetat $TAG" \
            --notes "Penandatanganan: ${{ steps.sign.outputs.signed }} (rotated = kunci baru, old = kunci lama)" \
            --prerelease "${TARGET[@]}"
          echo "RELEASE=$TAG terbit, APK ada di tab Releases" >> "$GITHUB_STEP_SUMMARY"
          # Simpan 3 Release terakhir saja.
          gh release list --limit 100 --json tagName --jq '.[3:][].tagName' | while read -r t; do
            [ -n "$t" ] && gh release delete "$t" --cleanup-tag --yes || true
          done
